name: Build Windows

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build application
        run: python -m PyInstaller --noconfirm main_windows.spec
      - name: Test bundled models
        timeout-minutes: 5
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/MediapipeOSCApp/MediapipeOSC_windows.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
      - name: Package application
        shell: pwsh
        run: Compress-Archive -Path 'dist/MediapipeOSCApp' -DestinationPath 'MediapipeOSC-windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: MediapipeOSC-windows-x64
          path: MediapipeOSC-windows-x64.zip
          if-no-files-found: error
